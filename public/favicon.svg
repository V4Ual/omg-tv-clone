<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Soft outline glow -->
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep black circle base matching reference -->
  <circle cx="32" cy="32" r="30" fill="#000000" stroke="#222226" stroke-width="1.5" />

  <!-- Crisp white outline hollow lightning bolt -->
  <g filter="url(#boltGlow)">
    <path d="M34 8 L14 34 H31 L30 56 L50 30 H33 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
